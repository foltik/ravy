[workspace]
members = ["lib", "apps/*"]
resolver = "3"

[workspace.package]
authors = ["Jack Foltz <jack@foltz.io>"]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/foltik/ravy"
readme = "README.md"


[workspace.dependencies]
lib = { path = "./lib" }

argh = "0.1"
anyhow = "1"
syn = "2"
quote = "1"
dyn-clone = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"

midir = "0.10"
serialport = "4"
rosc = "0.5"
cpal = "0.16"
rtrb = "0.3"
sacn = { git = "https://github.com/RustLight/sacn" }
artnet = { package = "artnet_protocol", version = "0.4" }
v4l = "0.14"
rand = "0.8"
itertools = "0.14"

bevy-trait-query = "0.19"
bevy_egui = "0.40"
bevy-inspector-egui = "0.37"
egui_dock = "0.19.1"
egui_plot = "0.35"

[workspace.dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "bevy_log",
    "bevy_winit",
    "bevy_gltf",
    "bevy_scene",
    "bevy_pbr",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "bevy_post_process",
    # bevy-inspector-egui registers inspector impls for gizmo config types.
    "bevy_gizmos",
    "bevy_gizmos_render",
    "default_font",
    "bevy_animation",
    "gltf_animation",
    # Light cookies: PointLightTexture / SpotLightTexture / DirectionalLightTexture.
    "pbr_light_textures",
    # Hardware raytracing. Only the scene half is used: the beam pass traces its
    # own occlusion against the acceleration structure this builds, and none of
    # solari's lighting passes are added.
    "bevy_solari",
    # Populates the type registry, which the inspector reads. Part of bevy's
    # default features, which we opt out of.
    "reflect_auto_register",
    "tonemapping_luts",
    "jpeg",
    "png",
    "dynamic_linking",
    "file_watcher",
    "multi_threaded",
    "std",
]
