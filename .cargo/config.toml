[unstable]
codegen-backend = true

# WARNING: impure. System libs (libudev, alsa) resolve via the host's
# pkg-config dirs, since ~/.jack/prefix/bin/pkg-config shadows the system one.
[env]
PKG_CONFIG_PATH = "/usr/lib/pkgconfig:/usr/share/pkgconfig"


[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-Zthreads=16", "-Zshare-generics=y", "-Clink-arg=-fuse-ld=mold"]

[target.'cfg(target_os = "macos")']
rustflags = ["-Zthreads=16", "-Zshare-generics=y"]

[target.'cfg(target_os = "windows")']
linker = "rust-lld.exe"
rustflags = ["-Zthreads=16", "-Zshare-generics=y"]


[profile.dev]
opt-level = 1
codegen-backend = "cranelift"

[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"


[profile.release]
debug = "line-tables-only"
panic = "abort"
lto = "thin"
